  <text x="72" y="132" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="37" font-weight="900">Connected systems. One execution core.</text>
  <text x="72" y="165" fill="#7F91AF" font-family="Arial,sans-serif" font-size="18">Live data layers orbit around workflow logic, automation, and decision intelligence.</text>

  <g fill="none" stroke-linecap="round">
    <path d="M440 270C565 255 600 300 686 315" stroke="#00F5A0" stroke-opacity=".45" stroke-width="2" stroke-dasharray="8 13">
      <animate attributeName="stroke-dashoffset" values="0;-84" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M456 455C575 450 620 400 690 365" stroke="#00D9FF" stroke-opacity=".45" stroke-width="2" stroke-dasharray="8 13">
