    <animateTransform attributeName="transform" type="translate" values="1155 420;1155 406;1155 420" dur="6s" repeatCount="indefinite"/>
    <polygon points="0,20 330,42 370,20 40,0" fill="#221B39" stroke="#FFD166" stroke-opacity=".38"/>
    <polygon points="0,20 330,42 330,152 0,132" fill="url(#glass)" stroke="#4B3B52"/>
    <polygon points="330,42 370,20 370,126 330,152" fill="#121024" stroke="#47344D"/>
