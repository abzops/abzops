    <circle r="7" fill="#A78BFA" filter="url(#core-neon)">
      <animateMotion dur="7s" begin="-4.7s" repeatCount="indefinite" path="M-280 0A280 96 0 1 0 280 0A280 96 0 1 0-280 0"/>
    </circle>

