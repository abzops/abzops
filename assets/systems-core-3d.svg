    <polygon points="0,22 350,48 390,24 40,0" fill="#161B3B" stroke="#8B5CF6" stroke-opacity=".42"/>
    <polygon points="0,22 350,48 350,180 0,154" fill="url(#glass)" stroke="#31346D"/>
    <polygon points="350,48 390,24 390,150 350,180" fill="#0C1028" stroke="#292C59"/>
