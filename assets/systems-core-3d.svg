      <polygon points="0,-132 138,-54 0,25 -138,-54" fill="url(#cube-top)" stroke="#B9F8FF" stroke-opacity=".7"/>
      <polygon points="-138,-54 0,25 0,186 -138,106" fill="url(#cube-left)" stroke="#36FBC0" stroke-opacity=".66"/>
      <polygon points="0,25 138,-54 138,106 0,186" fill="url(#cube-right)" stroke="#B89CFF" stroke-opacity=".66"/>
      <polygon points="0,-82 78,-38 0,6 -78,-38" fill="#08162A" stroke="#7CF9FF"/>
      <polygon points="-78,-38 0,6 0,94 -78,49" fill="#071E2B" stroke="#00F5A0" stroke-opacity=".7"/>
      <polygon points="0,6 78,-38 78,49 0,94" fill="#17143B" stroke="#A78BFA" stroke-opacity=".75"/>
      <text x="0" y="-31" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="21" font-weight="900">OPS</text>
      <text x="0" y="-7" text-anchor="middle" fill="#00F5A0" font-family="monospace" font-size="12" letter-spacing="3">CORE</text>
      <path d="M-112-38L0 26L112-38" fill="none" stroke="#FFFFFF" stroke-opacity=".22"/>
      <path d="M0 26V158" stroke="#FFFFFF" stroke-opacity=".18"/>
    </g>

    <ellipse cy="205" rx="146" ry="28" fill="#00D9FF" opacity=".08" filter="url(#core-neon)">
