    <circle cx="565" cy="530" r="2"><animate attributeName="cy" values="530;485;530" dur="5.6s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="550" r="2"><animate attributeName="cy" values="550;500;550" dur="6.4s" repeatCount="indefinite"/></circle>
