    <text x="72" y="82" fill="#00F5A0" font-family="monospace" font-size="14" letter-spacing="2">LAYER 01</text>
    <text x="72" y="111" fill="#FFFFFF" font-family="Arial" font-size="24" font-weight="800">Inventory Engine</text>
    <text x="72" y="137" fill="#7F91AF" font-family="Arial" font-size="15">GRN - MIV - MRN - WIP - BIN</text>
