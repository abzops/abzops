    <text x="30" y="100" fill="#FFFFFF" font-family="Arial" font-size="23" font-weight="800">Decision Intelligence</text>
    <text x="30" y="126" fill="#7F91AF" font-family="Arial" font-size="15">KPI - SIGNALS - FORECAST - ACTION</text>
