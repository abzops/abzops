      <circle cx="330" cy="105" r="5"><animate attributeName="r" values="4;9;4" dur="1.8s" begin="-.6s" repeatCount="indefinite"/></circle>
      <circle cx="306" cy="120" r="5"><animate attributeName="r" values="4;9;4" dur="1.8s" begin="-1.2s" repeatCount="indefinite"/></circle>
    </g>
