      <animate attributeName="opacity" values="1;.2;1" dur="1.25s" repeatCount="indefinite"/>
    </circle>
    <text x="45" y="31" fill="#00F5A0" font-family="monospace" font-size="17" font-weight="700" letter-spacing="3">3D OPERATIONS ARCHITECTURE</text>
