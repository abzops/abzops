<svg width="1600" height="640" viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="core-bg" x2="1" y2="1">
      <stop stop-color="#020617"/>
      <stop offset=".48" stop-color="#071426"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="core-line" x2="1">
      <stop stop-color="#00F5A0"/>
      <stop offset=".48" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cube-top" x2="1" y2="1">
      <stop stop-color="#0FE8FF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="cube-left" x2=".9" y2="1">
      <stop stop-color="#00F5A0" stop-opacity=".68"/>
      <stop offset="1" stop-color="#063B5C" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="cube-right" x2="0" y2="1">
      <stop stop-color="#7C3AED" stop-opacity=".88"/>
      <stop offset="1" stop-color="#111A46" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#12233E" stop-opacity=".88"/>
      <stop offset="1" stop-color="#06101F" stop-opacity=".94"/>
    </linearGradient>
    <radialGradient id="core-glow">
      <stop stop-color="#00D9FF" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#7C3AED" stop-opacity=".12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="core-grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#233558" stroke-opacity=".24"/>
    </pattern>
    <filter id="core-neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="core-shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000814" flood-opacity=".85"/>
    </filter>
  </defs>

  <rect width="1600" height="640" rx="28" fill="url(#core-bg)"/>
  <rect width="1600" height="640" rx="28" fill="url(#core-grid)"/>
  <rect x="1" y="1" width="1598" height="638" rx="27" fill="none" stroke="#243557" stroke-width="2"/>
  <ellipse cx="800" cy="332" rx="520" ry="320" fill="url(#core-glow)">
    <animate attributeName="rx" values="470;550;470" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".72;1;.72" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>

  <g opacity=".24" stroke="#2E4A78" stroke-width="1">
    <path d="M90 575L800 305L1510 575"/>
    <path d="M210 600L800 305L1390 600"/>
    <path d="M370 620L800 305L1230 620"/>
    <path d="M565 630L800 305L1035 630"/>
    <path d="M80 530H1520"/>
    <path d="M160 565H1440"/>
    <path d="M260 600H1340"/>
  </g>

  <g transform="translate(72 50)">
