<svg width="1600" height="700" viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020202"/>
      <stop offset=".55" stop-color="#090909"/>
      <stop offset="1" stop-color="#0D0900"/>
    </linearGradient>
    <linearGradient id="hero-gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFF06A"/>
      <stop offset=".48" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="hero-name" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".58" stop-color="#F4F4F4"/>
      <stop offset=".82" stop-color="#FFE44A"/>
      <stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
    <linearGradient id="hero-panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#181818" stop-opacity=".96"/>
      <stop offset="1" stop-color="#080808" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="screen-frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2C2A19"/>
      <stop offset=".32" stop-color="#121212"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="screen-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17160D"/>
      <stop offset=".52" stop-color="#0C0C0C"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="deck-top" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#292715"/>
      <stop offset=".45" stop-color="#121212"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="deck-edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF9F1C"/>
      <stop offset=".5" stop-color="#FFE44A"/>
      <stop offset="1" stop-color="#FFD400"/>
    </linearGradient>
    <radialGradient id="hero-aura">
      <stop stop-color="#FFD400" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#FF9F1C" stop-opacity=".07"/>
      <stop offset="1" stop-color="#020202" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#5A4A10" stroke-opacity=".1"/>
    </pattern>
    <filter id="hero-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hero-shadow" x="-45%" y="-45%" width="190%" height="210%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity=".92"/>
    </filter>
    <filter id="hero-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .028"/></feComponentTransfer>
    </filter>
    <clipPath id="hero-clip"><rect width="1600" height="700" rx="30"/></clipPath>
    <clipPath id="screen-clip"><rect width="390" height="225" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="1600" height="700" fill="url(#hero-bg)"/>
    <rect width="1600" height="700" fill="url(#hero-grid)"/>
    <rect width="1600" height="700" filter="url(#hero-noise)" opacity=".5"/>
    <ellipse cx="1235" cy="330" rx="490" ry="410" fill="url(#hero-aura)">
      <animate attributeName="rx" values="440;520;440" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".68;1;.68" dur="6.5s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M-280 620L930-90" stroke="#FFFFFF" stroke-opacity=".018" stroke-width="150">
      <animateTransform attributeName="transform" type="translate" values="-220 0;960 0;-220 0" dur="14s" repeatCount="indefinite"/>
    </path>

    <g transform="translate(70 64)">
      <rect width="330" height="42" rx="12" fill="#090909" stroke="#FFD400" stroke-opacity=".42"/>
      <circle cx="22" cy="21" r="4" fill="#FFD400" filter="url(#hero-glow)">
        <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="27" fill="#FFE44A" font-family="monospace" font-size="13" font-weight="700" letter-spacing="3.5">AI / AUTOMATION / SYSTEMS</text>
    </g>

    <g transform="translate(70 142)">
      <text y="96" fill="url(#hero-name)" font-family="Arial,sans-serif" font-size="102" font-weight="900" letter-spacing="-4">ABHINAND</text>
      <text y="143" fill="#F2F2F2" font-family="Arial,sans-serif" font-size="24" font-weight="600">AI Operations Architect  |  ERP Automation  |  Systems Builder</text>
      <text y="195" fill="#9E9E9E" font-family="Arial,sans-serif" font-size="17">Intelligent systems for controlled operations and measurable execution.</text>

      <g transform="translate(0 231)">
        <rect width="660" height="61" rx="14" fill="url(#hero-panel)" stroke="#343019"/>
        <text x="22" y="38" fill="#FFD400" font-family="monospace" font-size="17">&gt;</text>
        <text x="48" y="38" fill="#F6D84C" font-family="monospace" font-size="17">I build ERP systems that scale.</text>
        <rect x="344" y="20" width="8" height="25" fill="#FFD400">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g transform="translate(0 326)">
        <g>
          <rect width="203" height="84" rx="16" fill="url(#hero-panel)" stroke="#3D3512"/>
          <g transform="translate(18 19)" fill="none" stroke="#FFD400" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3L0 10L6 17M18 3L24 10L18 17M15 0L9 20"/></g>
          <text x="61" y="32" fill="#FFFFFF" font-family="Arial" font-size="14" font-weight="900">ERPNEXT</text>
          <text x="61" y="53" fill="#9A9A9A" font-family="Arial" font-size="12">Frappe Expert</text>
          <text x="18" y="72" fill="#6C6C6C" font-family="monospace" font-size="9" letter-spacing="1.3">ERP ARCHITECTURE</text>
        </g>
        <g transform="translate(220)">
          <rect width="203" height="84" rx="16" fill="url(#hero-panel)" stroke="#3D3512"/>
          <g transform="translate(18 17)" fill="none" stroke="#FFD400" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 0L3 17H13L9 34L25 13H15Z"/></g>
          <text x="61" y="34" fill="#FFFFFF" font-family="Arial" font-size="22" font-weight="900">8+</text>
          <text x="61" y="56" fill="#9A9A9A" font-family="Arial" font-size="12">Projects Delivered</text>
        </g>
        <g transform="translate(440)">
          <rect width="203" height="84" rx="16" fill="url(#hero-panel)" stroke="#3D3512"/>
          <g transform="translate(18 18)" fill="none" stroke="#FFD400" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8L14 1L26 8L14 15ZM2 8V23L14 30L26 23V8M14 15V30"/></g>
          <text x="61" y="34" fill="#FFFFFF" font-family="Arial" font-size="22" font-weight="900">5+</text>
          <text x="61" y="56" fill="#9A9A9A" font-family="Arial" font-size="12">Systems Built</text>
        </g>
      </g>
    </g>

    <g transform="translate(1005 116)" filter="url(#hero-shadow)">
      <animateTransform attributeName="transform" type="translate" values="1005 116;1005 103;1005 116" dur="6.5s" repeatCount="indefinite"/>
      <polygon points="-12,-8 440,85 440,356 -12,263" fill="url(#screen-frame)" stroke="#FFD400" stroke-opacity=".72" stroke-width="2"/>
      <polygon points="440,85 458,74 458,343 440,356" fill="#16130A" stroke="#9B7D00" stroke-opacity=".7"/>
      <polygon points="-12,-8 6,-20 458,74 440,85" fill="#302A10" stroke="#FFDF38" stroke-opacity=".55"/>
      <g transform="matrix(1 .205 0 1 8 6)" clip-path="url(#screen-clip)">
        <rect width="410" height="245" rx="8" fill="url(#screen-glass)"/>
        <rect width="74" height="245" fill="#0B0B0B"/>
        <text x="15" y="25" fill="#FFD400" font-family="Arial" font-size="14" font-weight="900">ERPNext</text>
        <g font-family="Arial" font-size="8" fill="#858585">
          <text x="15" y="55">Dashboard</text><text x="15" y="78">CRM</text><text x="15" y="101">Finance</text><text x="15" y="124">HR</text><text x="15" y="147">Inventory</text><text x="15" y="170">Projects</text>
        </g>
        <rect x="8" y="39" width="57" height="23" rx="5" fill="#28230C" stroke="#FFD400" stroke-opacity=".35"/>
        <g transform="translate(92 24)">
          <rect width="142" height="78" rx="8" fill="#111111" stroke="#363015"/>
          <text x="12" y="17" fill="#8C8C8C" font-family="monospace" font-size="7" letter-spacing="1">OPERATIONS SIGNAL</text>
          <path d="M12 61C30 58 38 28 56 38S83 58 96 34S119 50 132 23" fill="none" stroke="#3A351A" stroke-width="3"/>
          <path d="M12 61C30 58 38 28 56 38S83 58 96 34S119 50 132 23" fill="none" stroke="#FFD400" stroke-width="3" stroke-dasharray="190" stroke-dashoffset="190">
            <animate attributeName="stroke-dashoffset" values="190;0;0" keyTimes="0;.72;1" dur="4.2s" repeatCount="indefinite"/>
          </path>
          <circle r="4" fill="#FFF06A" filter="url(#hero-glow)"><animateMotion dur="4.2s" repeatCount="indefinite" path="M12 61C30 58 38 28 56 38S83 58 96 34S119 50 132 23"/></circle>
        </g>
        <g transform="translate(250 24)">
          <rect width="142" height="78" rx="8" fill="#111111" stroke="#363015"/>
          <text x="12" y="17" fill="#8C8C8C" font-family="monospace" font-size="7" letter-spacing="1">DELIVERY INDEX</text>
          <g fill="url(#hero-gold)">
            <rect x="18" y="48" width="15" height="19"><animate attributeName="height" values="8;19;12;19" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="59;48;55;48" dur="2.8s" repeatCount="indefinite"/></rect>
            <rect x="43" y="35" width="15" height="32"><animate attributeName="height" values="12;32;24;32" dur="3.2s" repeatCount="indefinite"/><animate attributeName="y" values="55;35;43;35" dur="3.2s" repeatCount="indefinite"/></rect>
            <rect x="68" y="43" width="15" height="24"><animate attributeName="height" values="10;24;18;24" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="57;43;49;43" dur="2.6s" repeatCount="indefinite"/></rect>
            <rect x="93" y="25" width="15" height="42"><animate attributeName="height" values="16;42;31;42" dur="3.6s" repeatCount="indefinite"/><animate attributeName="y" values="51;25;36;25" dur="3.6s" repeatCount="indefinite"/></rect>
          </g>
        </g>
        <g transform="translate(92 119)">
          <rect width="205" height="92" rx="8" fill="#101010" stroke="#342F16"/>
          <text x="12" y="18" fill="#8C8C8C" font-family="monospace" font-size="7" letter-spacing="1">WORKFLOW MAP</text>
          <g fill="#1B1B1B" stroke="#FFD400" stroke-opacity=".55">
            <rect x="15" y="37" width="43" height="22" rx="4"/><rect x="82" y="28" width="43" height="22" rx="4"/><rect x="146" y="45" width="43" height="22" rx="4"/><rect x="82" y="65" width="43" height="18" rx="4"/>
          </g>
          <g fill="none" stroke="#FFD400" stroke-opacity=".6" stroke-dasharray="5 7"><path d="M58 48L82 39M125 39L146 53M103 50V65"><animate attributeName="stroke-dashoffset" values="0;-48" dur="2.4s" repeatCount="indefinite"/></path></g>
        </g>
        <g transform="translate(313 119)">
          <rect width="79" height="92" rx="8" fill="#101010" stroke="#342F16"/>
          <circle cx="39" cy="44" r="24" fill="none" stroke="#292929" stroke-width="10"/>
          <circle cx="39" cy="44" r="24" fill="none" stroke="#FFD400" stroke-width="10" stroke-dasharray="95 56" transform="rotate(-90 39 44)"><animateTransform attributeName="transform" type="rotate" values="-90 39 44;270 39 44" dur="8s" repeatCount="indefinite"/></circle>
          <text x="39" y="82" text-anchor="middle" fill="#8C8C8C" font-family="monospace" font-size="7">CONTROL</text>
        </g>
        <rect y="-22" width="410" height="24" fill="#FFD400" opacity=".035"><animate attributeName="y" values="-22;245;-22" dur="5.5s" repeatCount="indefinite"/></rect>
      </g>

      <polygon points="-92,277 434,386 279,493 -246,382" fill="url(#deck-top)" stroke="#FFD400" stroke-opacity=".72" stroke-width="2"/>
      <polygon points="-246,382 279,493 279,511 -246,400" fill="#080808" stroke="#806900"/>
      <polygon points="279,493 434,386 434,403 279,511" fill="#111008" stroke="#806900"/>
      <path d="M-92 277L434 386" stroke="url(#deck-edge)" stroke-width="3" filter="url(#hero-glow)"/>
      <g opacity=".52" fill="none" stroke="#C9AA18" stroke-width="1">
        <path d="M-115 326L277 408M-137 344L255 426M-159 362L233 444"/>
        <path d="M-46 312L-111 386M12 324L-53 398M70 336L5 410M128 348L63 422M186 360L121 434M244 372L179 446M302 384L237 458"/>
      </g>
      <polygon points="22,365 172,396 116,435 -34,403" fill="#0A0A0A" stroke="#665614"/>
      <polygon points="-196,410 236,501 112,566 -320,475" fill="#090909" stroke="#5E4E0C" stroke-opacity=".7"/>
      <path d="M-320 475L112 566" stroke="#FFD400" stroke-opacity=".5"/>
      <g opacity=".52" stroke="#FFD400" stroke-width="1">
        <path d="M-258 446L34 507M-232 459L60 520M-206 472L86 533"/>
      </g>
    </g>

    <g opacity=".65" fill="none" stroke="#FFD400" stroke-width="1.4">
      <path d="M820 220C885 190 925 185 980 206" stroke-dasharray="2 10"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.8s" repeatCount="indefinite"/></path>
      <path d="M838 265C902 238 940 239 986 255" stroke-dasharray="2 10"><animate attributeName="stroke-dashoffset" values="0;-72" dur="3.2s" repeatCount="indefinite"/></path>
      <path d="M1425 250C1492 230 1530 242 1580 276" stroke-dasharray="2 10"><animate attributeName="stroke-dashoffset" values="0;72" dur="3s" repeatCount="indefinite"/></path>
    </g>
    <g fill="#FFD400" filter="url(#hero-glow)">
      <circle cx="980" cy="206" r="4"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="986" cy="255" r="4"><animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1425" cy="250" r="4"><animate attributeName="r" values="3;7;3" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="58" y="665" width="1484" height="2" fill="#292929"/>
    <rect x="58" y="665" width="300" height="2" fill="url(#hero-gold)"><animate attributeName="x" values="58;1242;58" dur="9s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="1598" height="698" rx="29" fill="none" stroke="#3B3418" stroke-width="2"/>
</svg>
