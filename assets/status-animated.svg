<svg width="1600" height="260" viewBox="0 0 1600 260" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".5" stop-color="#07111F"/><stop offset="1" stop-color="#020617"/></linearGradient><linearGradient id="b"><stop stop-color="#00F5A0"/><stop offset=".5" stop-color="#00D9FF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
<rect width="1600" height="260" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1598" height="258" rx="23" fill="none" stroke="#1D2B49" stroke-width="2"/>
<text x="80" y="60" fill="#fff" font-family="Arial" font-size="34" font-weight="900">Build Status</text><text x="80" y="90" fill="#7C8CA8" font-family="Arial" font-size="18">Current engineering modes and execution focus.</text>
<g font-family="Arial">
<g transform="translate(80 125)"><text y="20" fill="#D8E3F7" font-size="17" font-weight="700">SYSTEM DESIGN</text><rect y="38" width="360" height="12" rx="6" fill="#111827"/><rect y="38" width="310" height="12" rx="6" fill="url(#b)"><animate attributeName="width" values="40;310;280;310" dur="3.5s" repeatCount="indefinite"/></rect><text y="82" fill="#00F5A0" font-size="14">ONLINE / ACTIVE</text></g>
<g transform="translate(470 125)"><text y="20" fill="#D8E3F7" font-size="17" font-weight="700">ERP AUTOMATION</text><rect y="38" width="360" height="12" rx="6" fill="#111827"/><rect y="38" width="286" height="12" rx="6" fill="url(#b)"><animate attributeName="width" values="80;286;250;286" dur="4s" repeatCount="indefinite"/></rect><text y="82" fill="#00D9FF" font-size="14">BUILDING / ITERATING</text></g>
<g transform="translate(860 125)"><text y="20" fill="#D8E3F7" font-size="17" font-weight="700">AI EXECUTION</text><rect y="38" width="300" height="12" rx="6" fill="#111827"/><rect y="38" width="255" height="12" rx="6" fill="url(#b)"><animate attributeName="width" values="60;255;225;255" dur="3.2s" repeatCount="indefinite"/></rect><text y="82" fill="#A855F7" font-size="14">ACCELERATED</text></g>
<g transform="translate(1220 125)"><circle cx="35" cy="35" r="29" fill="#07111F" stroke="#00F5A0" stroke-width="3"><animate attributeName="stroke-opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="35" cy="35" r="8" fill="#00F5A0"><animate attributeName="r" values="6;12;6" dur="1.8s" repeatCount="indefinite"/></circle><text x="82" y="28" fill="#fff" font-size="18" font-weight="800">STATUS</text><text x="82" y="55" fill="#00F5A0" font-size="15">READY TO BUILD</text></g>
</g>
</svg>
