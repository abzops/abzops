<svg width="1600" height="340" viewBox="0 0 1600 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A0A08"/><stop offset=".5" stop-color="#0E0E0C"/><stop offset="1" stop-color="#0A0A08"/></linearGradient>
<linearGradient id="ln"><stop stop-color="#FFF3A3"/><stop offset=".5" stop-color="#FFF3A3"/><stop offset="1" stop-color="#FFF3A3"/></linearGradient>
