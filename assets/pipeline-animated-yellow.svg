<g transform="translate(1070 145)"><rect width="190" height="120" rx="18" fill="#0E0E0C" stroke="#FFF3A3" stroke-opacity=".45"/><text x="95" y="38" text-anchor="middle" fill="#FFF3A3" font-size="15" font-weight="800">05 AUTOMATE</text><text x="95" y="72" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Triggers &amp; APIs</text><text x="95" y="96" text-anchor="middle" fill="#8F8F8F" font-size="14">Bots - Alerts - Flows</text></g>
