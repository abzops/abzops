<rect width="1600" height="340" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1598" height="338" rx="23" fill="none" stroke="#191917" stroke-width="2"/>
<text x="80" y="60" fill="#fff" font-family="Arial" font-size="34" font-weight="900">Live System Pipeline</text>
<text x="80" y="90" fill="#8B8B8B" font-family="Arial" font-size="18">From operational problem to measurable business impact.</text>
